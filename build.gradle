plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.shunn2'
version = '0.0.1-SNAPSHOT'
description = 'spring-ai-review'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'   // JPA
    implementation 'org.springframework.boot:spring-boot-h2console'          // H2 웹 콘솔
    runtimeOnly 'com.h2database:h2'                                          // H2 DB
    compileOnly 'org.projectlombok:lombok'                                   // Lombok: 컴파일할 때만 필요
    annotationProcessor 'org.projectlombok:lombok'                           // Lombok: 컴파일 때 코드 생성
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'                               // 테스트 코드에서도 Lombok 사용
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
